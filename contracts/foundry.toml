[profile.default]
src = "src"
out = "out"
libs = ["lib", "node_modules"]
offline = true
auto_detect_solc = true
optimizer = true
optimizer_runs = 200
remappings = [
  "forge-std/=lib/forge-std/src/",
  "@openzeppelin/=node_modules/@openzeppelin/",
  "stablecoin/=../vendor/stablecoin-evm/contracts/",
]
allow_paths = ["../vendor"]
